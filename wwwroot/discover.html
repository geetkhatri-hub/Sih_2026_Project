<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Discover — VeriYatra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css" />
</head>
<body>

  <header class="site-header">
    <div class="inner">
      <a href="discover.html" class="brand"><span class="dot">●</span> VeriYatra</a>
      <nav class="nav-links">
        <a href="discover.html" class="active">Discover</a>
        <a href="verify.html">Verify a Guide</a>
        <a href="fare-calculator.html">Fair Fare</a>
        <a href="profile.html">Profile</a>
        <a href="login.html" class="cta">Login</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div class="eyebrow">Authentic discovery</div>
      <h1>Spots near you</h1>
      <p>Hand-curated, non-sponsored local spots — not a paid-placement feed. Filter by category or search by name.</p>
    </div>

    <!-- Filter bar -->
    <div style="display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;">
      <input type="text" id="searchInput" placeholder="Search spots…"
        style="flex:1;min-width:200px;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px;" />
      <select id="categoryFilter" style="padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px;">
        <option value="all">All categories</option>
        <option value="Heritage">Heritage</option>
        <option value="Food">Food</option>
        <option value="Nature">Nature</option>
        <option value="Craft">Craft &amp; Artisan</option>
      </select>
    </div>

    <div class="spot-grid" id="spotGrid"><!-- JS renders cards here --></div>
  </main>

  <footer class="site-footer">VeriYatra — SIH 2026 Internal Hackathon prototype · practice build</footer>

  <script>
    // ---------------------------------------------------------------------
    // NOTE FOR ASP.NET PORT:
    // This SPOTS array is a stand-in for your real data source. In the real
    // app this should come from your curated dataset (Firestore collection
    // or, in ASP.NET, a database table via Entity Framework), fetched with
    // something like: GET /api/spots?city=agra
    // See "Your API Integration Plan" doc — Option B (curated list) — for
    // why this is hand-picked rather than pulled from a live social API.
    // ---------------------------------------------------------------------
    const SPOTS = [
      { name: "Mehtab Bagh", category: "Heritage", desc: "A quiet Mughal garden across the river from the Taj — the classic sunset view without the crowds." },
      { name: "Kinari Bazaar", category: "Craft", desc: "A narrow old-city market lane known for zari embroidery and traditional Agra footwear." },
      { name: "Sadar Bazaar Food Walk", category: "Food", desc: "Local-recommended stalls for petha and bedai — not the tourist-trap versions near the monuments." },
      { name: "Chini Ka Rauza", category: "Heritage", desc: "A lesser-visited Persian-tiled tomb, usually empty even in peak season." },
      { name: "Keetham Lake (Sur Sarovar)", category: "Nature", desc: "A bird sanctuary just outside the city — a good half-day trip away from the monument circuit." },
      { name: "Dayalbagh Marble Inlay Workshops", category: "Craft", desc: "Watch artisans practicing the same pietra dura inlay technique used on the Taj itself." }
    ];

    const grid = document.getElementById('spotGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');

    function render(){
      const q = searchInput.value.trim().toLowerCase();
      const cat = categoryFilter.value;
      const filtered = SPOTS.filter(s =>
        (cat === 'all' || s.category === cat) &&
        (s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q))
      );

      grid.innerHTML = filtered.length ? '' : `<p style="color:var(--text-dim);grid-column:1/-1;">No spots match that search — try a different term or category.</p>`;

      filtered.forEach(s => {
        const card = document.createElement('div');
        card.className = 'spot-card';
        card.innerHTML = `
          <div class="thumb">${s.name}</div>
          <div class="body">
            <span class="badge badge-tag">${s.category}</span>
            <h3 style="margin-top:8px;">${s.name}</h3>
            <p>${s.desc}</p>
            <a href="verify.html" class="btn btn-ghost" style="width:100%;">See verified guides here</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', render);
    categoryFilter.addEventListener('change', render);
    render();
  </script>
</body>
</html>
